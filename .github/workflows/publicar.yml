name: Publicar página

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"   # de hora em hora, puxa o Sympla de novo
  workflow_dispatch:        # botão "Run workflow" para atualizar na hora

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Buscar eventos no Sympla
        env:
          SYMPLA_TOKEN_1: ${{ secrets.SYMPLA_TOKEN_1 }}
          SYMPLA_TOKEN_2: ${{ secrets.SYMPLA_TOKEN_2 }}
        run: node scripts/sympla.mjs

      - name: Montar o site
        run: |
          mkdir _site
          cp -r index.html eventos.json ajustes.json robots.txt og-galpao.jpg logo-lovatic.webp fotos _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
